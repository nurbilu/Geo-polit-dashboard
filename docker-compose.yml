services:
  db:
    image: mysql:8.0
    container_name: threat_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-threats}
      MYSQL_USER: ${MYSQL_USER:-threats}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-threats_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Expose DB to host so local Windows venv can run manage.py migrate.
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: threat_redis
    restart: unless-stopped
    # Lightweight, persistence-light config tuned for a start/stop lifecycle.
    command: >
      redis-server
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # NOTE: The local `ollama` service has been removed. AI analysis now runs
  # against OpenRouter's hosted API (see backend/threats/llama4_service.py),
  # freeing up local CPU/RAM. Credentials are supplied via OPENROUTER_* in .env.

  web:
    build:
      context: ./backend
    container_name: threat_web
    restart: unless-stopped
    command: ["web"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.2-11b-vision-instruct}
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    container_name: threat_celery
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.2-11b-vision-instruct}
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
    container_name: threat_beat
    restart: unless-stopped
    command: ["beat"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: threat_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      web:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  media_data:
