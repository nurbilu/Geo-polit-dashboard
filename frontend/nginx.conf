server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: route everything to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Django (Gunicorn/WSGI) service.
    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy scraped/downloaded media served by Django.
    location /media/ {
        proxy_pass http://web:8000/media/;
        proxy_set_header Host $host;
    }

    # Proxy Django admin + its static assets.
    location /admin/ {
        proxy_pass http://web:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://web:8000/static/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
